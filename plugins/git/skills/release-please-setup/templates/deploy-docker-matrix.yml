name: Deploy __COMPONENT__ (Docker → ECR)

# Tag-driven single-service Docker build and push to Amazon ECR.
# Tag format: <component>-v<semver>  e.g. analytics-service-v2.3.0
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive component name from tag
        id: component
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Remove trailing -vX.Y.Z to get component name
          # e.g. analytics-service-v2.3.0 -> analytics-service
          COMPONENT=$(echo "$REF_NAME" | sed 's/-v[0-9]*\.[0-9]*\.[0-9]*$//')
          VERSION=$(echo "$REF_NAME" | sed 's/.*-v//')
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25 (temurin)
        # REPLACE: your build toolchain (JDK, Python, Node, etc.)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # REPLACE: build your service (e.g. ./gradlew :my-service:build)
      - name: Build service
        env:
          COMPONENT: ${{ steps.component.outputs.component }}
          VERSION: ${{ steps.component.outputs.version }}
        run: |
          echo "Replace with your build command for $COMPONENT"
          # Example: ./gradlew :"$COMPONENT":build -Pversion="$VERSION" --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: 'true'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # REPLACE: ECR_REPOSITORY base path (e.g. secrets.ECR_REPOSITORY / your-org)
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}/__COMPONENT__
          IMAGE_TAG: ${{ steps.component.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
            -f __DOCKERFILE_PATH__ \
            --push \
            __BUILD_CONTEXT__

          # Verify image was pushed
          aws ecr describe-images \
            --repository-name ${ECR_REPOSITORY} \
            --image-ids imageTag=${IMAGE_TAG}

      # Optional: add a Slack failure notification (see CONTRACT.md)
