name: Release __COMPONENT__

on:
  push:
    tags:
      - "__COMPONENT__-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node & pnpm
        # REPLACE: your build setup (composite action or individual steps)
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # REPLACE: produce your artifact (build step, compile, etc.)
      - name: Build __COMPONENT__
        run: echo "build your artifact here"

      - name: Read package version
        id: pkg
        working-directory: __PACKAGE_PATH__
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=__ARTIFACT_NAME__-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          EXPECTED="__COMPONENT__-v${PKG_VERSION}"
          if [ "$REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag '$REF_NAME' does not match expected '$EXPECTED' (from package.json version)"
            exit 1
          fi

      # REPLACE: package your artifact (e.g. zip/vsix/tarball)
      - name: Package artifact
        working-directory: __PACKAGE_PATH__
        env:
          ARTIFACT_NAME: ${{ steps.pkg.outputs.artifact }}
        run: |
          # Example: pnpm exec vsce package --no-dependencies --out "$ARTIFACT_NAME.vsix"
          # Example: zip -r "$ARTIFACT_NAME.zip" dist/
          echo "Replace with your packaging command producing __ARTIFACT_NAME__"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: __PACKAGE_PATH__/${{ steps.pkg.outputs.artifact }}
          draft: true
          name: "__COMPONENT__ ${{ steps.pkg.outputs.version }}"
          tag_name: ${{ github.ref_name }}
