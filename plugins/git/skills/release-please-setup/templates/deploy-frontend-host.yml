name: Deploy __COMPONENT__ (Frontend)

# Tag-driven frontend deploy with pre-deploy quality gates.
# Gates (type-check, lint, format, tests, build) can be bypassed for emergency
# hotfixes via workflow_dispatch with skip_gates=true.
on:
  push:
    tags:
      - "__COMPONENT__-v*"
  workflow_dispatch:
    inputs:
      skip_gates:
        description: "Skip pre-deploy verification gates. Emergency hotfix only."
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __PACKAGE_PATH__
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Warn on gate skip
        if: github.event.inputs.skip_gates == 'true'
        working-directory: .
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          echo "::warning::skip_gates=true — bypassing type-check, lint, format, tests, and build."
          echo "::warning::Triggered by $ACTOR for ref $SHA."

      # REPLACE: your node+pnpm setup (composite action or individual steps)
      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: __PACKAGE_PATH__/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # --- Quality gates (each skipped when skip_gates=true) ---

      - name: Type Check
        if: github.event.inputs.skip_gates != 'true'
        # REPLACE: your type-check command
        run: pnpm run type-check

      - name: Lint
        if: github.event.inputs.skip_gates != 'true'
        # REPLACE: your lint command
        run: pnpm run lint

      - name: Format Check
        if: github.event.inputs.skip_gates != 'true'
        # REPLACE: your format check command
        run: pnpm run format:check

      - name: Unit Tests
        if: github.event.inputs.skip_gates != 'true'
        # REPLACE: your test command (vitest, jest, etc.)
        run: pnpm run test:run

      - name: Build
        if: github.event.inputs.skip_gates != 'true'
        # REPLACE: your build command
        run: pnpm run build

      # --- Deploy ---

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

